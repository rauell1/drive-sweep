name: Bug report
description: Something in DriveSweep does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems:** please do not use this form; see SECURITY.md (Security tab > Report a vulnerability).
  - type: input
    id: version
    attributes:
      label: DriveSweep version
      description: Shown at the top left of the app, for example v0.7.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install DriveSweep?
      options:
        - Setup (installer)
        - Portable DriveSweep.exe
        - Folder version (DriveSweep-win64.zip)
        - winget
        - From source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 24H2 (run winver to check)
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Was DriveSweep running as Administrator?
      options:
        - "No"
        - "Yes"
        - Not sure
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Diagnostics log (optional)
      description: Settings & Updates > Open Diagnostics Log. Paste the relevant lines and remove any file paths you do not want to share.
      render: text
