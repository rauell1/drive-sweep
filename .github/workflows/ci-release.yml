name: Build, Test & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Least privilege by default; only the release job can write.
permissions:
  contents: read

# Every third party action is pinned to a full commit SHA (the tag is noted beside it),
# so a moved or hijacked tag cannot change what runs in this pipeline.

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check locked dependencies for known vulnerabilities
        run: pipx run pip-audit==2.10.1 --requirement requirements-dev.lock --require-hashes --disable-pip --progress-spinner off

  test:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.lock

      - name: Run unit tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -v

  build-check:
    name: Build and smoke test (unsigned)
    # Catches packaging problems on every pull request and push to main, long before a release tag.
    needs: [test]
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.lock

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build executables, zip and installer
        shell: pwsh
        run: .\build.ps1

      - name: Smoke test the portable exe and the folder version
        shell: pwsh
        run: |
          function Test-DriveSweep([string]$exe, [string]$label) {
            $report = Join-Path $env:RUNNER_TEMP "selftest-$label.json"
            $proc = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$report`"") -Wait -PassThru
            if (-not (Test-Path $report)) { throw "${label}: no self-test report was written (exit code $($proc.ExitCode))" }
            Get-Content $report -Raw | Write-Host
            $data = Get-Content $report -Raw | ConvertFrom-Json
            if ($proc.ExitCode -ne 0 -or -not $data.ok) { throw "${label}: self-test failed" }
          }
          Test-DriveSweep "dist\DriveSweep.exe" "onefile"
          Test-DriveSweep "dist\DriveSweep-win64\DriveSweep.exe" "onedir"

      - name: Smoke test silent install, installed app and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist\DriveSweep-Setup-*.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "DriveSweepInstall"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\DriveSweep.exe")) { throw "DriveSweep.exe was not installed" }

          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{7E8F3E52-3F2A-4D28-9E93-B9F5C2C4F612}_is1'
          $entry = Get-ItemProperty $key
          Write-Host "Installed apps entry: $($entry.DisplayName) $($entry.DisplayVersion) by $($entry.Publisher)"
          if ($entry.DisplayName -ne 'DriveSweep') { throw "Unexpected Installed apps name: $($entry.DisplayName)" }

          $report = Join-Path $env:RUNNER_TEMP "selftest-installed.json"
          $t = Start-Process -FilePath "$dir\DriveSweep.exe" -ArgumentList @('--self-test', "`"$report`"") -Wait -PassThru
          Get-Content $report -Raw | Write-Host
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }

          # The Inno uninstaller relaunches itself from a temp copy and returns at once, so wait for it.
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path "$dir\DriveSweep.exe") -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\DriveSweep.exe") { throw "Uninstall left DriveSweep.exe behind" }
          if (Test-Path $key) { throw "Uninstall left the Installed apps entry behind" }
          Write-Host "Install, run and uninstall all worked."

      - name: Upload test build (7 days, unsigned, for manual testing)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivesweep-test-build
          retention-days: 7
          path: |
            dist/DriveSweep.exe
            dist/DriveSweep-win64.zip
            dist/DriveSweep-Setup-*.exe
            dist/SHA256SUMS.txt

  arm64-check:
    name: Runs on Windows on ARM (x64 build under emulation)
    # DriveSweep ships x64 builds; Windows 11 on ARM runs them through its built in x64 emulation.
    # This installs and self-tests the exact test build on a real ARM64 runner.
    needs: [build-check]
    runs-on: windows-11-arm
    steps:
      - name: Download test build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drivesweep-test-build
          path: build

      - name: Self-test portable exe, then install, self-test and uninstall Setup
        shell: pwsh
        run: |
          Write-Host "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
          function Test-DriveSweep([string]$exe, [string]$label) {
            $report = Join-Path $env:RUNNER_TEMP "selftest-$label.json"
            $proc = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$report`"") -Wait -PassThru
            if (-not (Test-Path $report)) { throw "${label}: no self-test report was written (exit code $($proc.ExitCode))" }
            Get-Content $report -Raw | Write-Host
            if ($proc.ExitCode -ne 0 -or -not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw "${label}: self-test failed" }
          }
          Test-DriveSweep "build\DriveSweep.exe" "onefile-arm64"

          $setup = Get-ChildItem "build\DriveSweep-Setup-*.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "DriveSweepInstall"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with code $($p.ExitCode)" }
          Test-DriveSweep "$dir\DriveSweep.exe" "installed-arm64"
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\DriveSweep.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\DriveSweep.exe") { throw "Uninstall left DriveSweep.exe behind" }
          Write-Host "The x64 build installs, starts its interface engine and uninstalls on Windows on ARM."

  release:
    name: Build, sign and publish
    needs: [audit, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write      # publish the GitHub Release
      id-token: write      # build provenance attestation and Azure OIDC
      attestations: write  # build provenance attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.lock

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .\.venv\Scripts\python.exe scripts\bump_version.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $appVersion = (Select-String -Path app\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$appVersion" -ne $env:TAG) { Write-Error "Tag $env:TAG does not match app version $appVersion. Run scripts/bump_version.py before tagging."; exit 1 }

      # Only true/false flags leave this step; secret values stay inside the signing steps.
      - name: Detect signing configuration
        id: signing
        shell: pwsh
        env:
          HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_RELEASE_POLICY: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG == 'release-signing' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          "azure=$env:HAS_AZURE" >> $env:GITHUB_OUTPUT
          "signpath=$env:HAS_SIGNPATH" >> $env:GITHUB_OUTPUT
          "signpath_release=$env:SIGNPATH_RELEASE_POLICY" >> $env:GITHUB_OUTPUT
          # A test certificate is not trusted by Windows, and DriveSweep's updater rejects
          # updates whose signature is invalid. Never publish a tagged release signed with it.
          if ($env:IS_TAG -eq 'true' -and $env:HAS_SIGNPATH -eq 'true' -and $env:SIGNPATH_RELEASE_POLICY -ne 'true') {
            Write-Error "SIGNPATH_SIGNING_POLICY_SLUG is not 'release-signing'. Test signing is only for manual (workflow_dispatch) runs; set the release-signing policy before tagging a release."
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Stage 1: build the executables (portable exe and the folder bundle the installer ships).
      - name: Build executables
        shell: pwsh
        run: .\build.ps1 -Stage Binaries

      # Stage 2: sign the executables BEFORE they are zipped or packed into Setup,
      # so the DriveSweep.exe that ends up installed on users' PCs is signed too.
      - name: Sign executables (Azure Trusted Signing)
        if: steps.signing.outputs.azure == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\DriveSweep.exe,${{ github.workspace }}\dist\DriveSweep-win64\DriveSweep.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload unsigned executables for SignPath
        id: upload-unsigned-exes
        if: steps.signing.outputs.signpath == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivesweep-unsigned-exes
          path: |
            dist/DriveSweep.exe
            dist/DriveSweep-win64/DriveSweep.exe

      - name: Sign executables (SignPath Foundation)
        if: steps.signing.outputs.signpath == 'true'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.upload-unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          # SignPath Foundation release signing waits for a person to approve each request.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist

      # Stage 3: zip the signed bundle and build Setup into dist\setup\.
      - name: Package zip and installer
        shell: pwsh
        run: .\build.ps1 -Stage Package

      # Stage 4: sign the installer itself.
      - name: Sign installer (Azure Trusted Signing)
        if: steps.signing.outputs.azure == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\setup
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-setup
        if: steps.signing.outputs.signpath == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivesweep-unsigned-setup
          path: dist/setup/DriveSweep-Setup-*.exe

      - name: Sign installer (SignPath Foundation)
        if: steps.signing.outputs.signpath == 'true'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/setup

      # Stage 5: checksums, winget hash, SBOM.
      - name: Write SHA256SUMS and Winget manifest hash
        shell: pwsh
        run: |
          .\build.ps1 -Stage Checksums
          $setupExe = Get-ChildItem "dist\DriveSweep-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $wingetInstaller = "packaging\winget\rauell1.DriveSweep.installer.yaml"
          if ($setupExe -and (Test-Path $wingetInstaller)) {
            $setupSha = (Get-FileHash -Path $setupExe.FullName -Algorithm SHA256).Hash.ToUpper()
            $yaml = Get-Content -Path $wingetInstaller -Raw -Encoding UTF8
            $yaml = [regex]::Replace($yaml, '(InstallerSha256:\s*)[A-Za-z0-9_]+', "`${1}$setupSha")
            Set-Content -Path $wingetInstaller -Value $yaml -Encoding UTF8 -NoNewline
          }

      - name: Generate software bill of materials (CycloneDX)
        shell: pwsh
        run: pipx run --spec cyclonedx-bom==8.0.1 cyclonedx-py requirements requirements-dev.lock --of JSON -o dist\DriveSweep-sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/DriveSweep.exe
            dist/DriveSweep-win64.zip
            dist/DriveSweep-Setup-*.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivesweep-win64
          path: |
            dist/DriveSweep.exe
            dist/DriveSweep-win64.zip
            dist/DriveSweep-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/DriveSweep-sbom.cdx.json
            packaging/winget/*.yaml

      - name: Compose release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_LINE: ${{ steps.signing.outputs.signpath_release == 'true' && 'Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).' || (steps.signing.outputs.azure == 'true' && 'Executables are signed with Azure Trusted Signing.' || 'These builds are not code signed yet, so Windows SmartScreen may warn on first run. Verify the checksum and provenance above before running.') }}
          TAG: ${{ github.ref_name }}
        run: .\.venv\Scripts\python.exe scripts\release_notes.py --version $env:TAG --signing-line $env:SIGNING_LINE --out dist\RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/DriveSweep.exe
            dist/DriveSweep-win64.zip
            dist/DriveSweep-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/DriveSweep-sbom.cdx.json
            packaging/winget/*.yaml
