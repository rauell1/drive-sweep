name: Build, Test & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -r requirements-dev.txt

      - name: Run unit tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -v

      - name: Install Inno Setup for Setup.exe installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: choco install innosetup -y

      - name: Build Windows executables and installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: .\build.ps1

      - name: Optional Azure Trusted Signing
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.9
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload unsigned artifact for SignPath (when enabled)
        id: upload-unsigned-artifact
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v5
        with:
          name: drivesweep-unsigned
          path: |
            dist/DriveSweep.exe
            dist/DriveSweep-Setup-*.exe

      - name: Sign executables with SignPath Foundation (when configured)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Recompute SHA256SUMS and Winget manifest after signing
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $lines = @()
          $setupExe = Get-ChildItem "dist\DriveSweep-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $targets = @("dist\DriveSweep.exe", "dist\DriveSweep-win64.zip") + @(Get-ChildItem "dist\DriveSweep-Setup-*.exe" -ErrorAction SilentlyContinue | ForEach-Object { "dist\$($_.Name)" })
          foreach ($file in $targets) {
            if (Test-Path $file) {
              $h = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
              $lines += "$h  $(Split-Path $file -Leaf)"
            }
          }
          Set-Content -Path "dist\SHA256SUMS.txt" -Value $lines -Encoding UTF8

          $wingetInstaller = "packaging\winget\rauell1.DriveSweep.installer.yaml"
          if ($setupExe -and (Test-Path $wingetInstaller)) {
            $setupSha = (Get-FileHash -Path $setupExe.FullName -Algorithm SHA256).Hash.ToUpper()
            $yaml = Get-Content -Path $wingetInstaller -Raw -Encoding UTF8
            $yaml = [regex]::Replace($yaml, '(InstallerSha256:\s*)[A-Za-z0-9_]+', "`${1}$setupSha")
            Set-Content -Path $wingetInstaller -Value $yaml -Encoding UTF8 -NoNewline
          }

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: drivesweep-win64
          path: |
            dist/DriveSweep.exe
            dist/DriveSweep-win64.zip
            dist/DriveSweep-Setup-*.exe
            dist/SHA256SUMS.txt
            packaging/winget/*.yaml

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Interactive Windows disk analyzer and AI/dev cache cleaner with Recycle Bin and Permanent cleanup modes, Light/Dark themes, Administrator mode, and local-only data storage.

            ### Code Signing Policy
            Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).
          files: |
            dist/DriveSweep.exe
            dist/DriveSweep-win64.zip
            dist/DriveSweep-Setup-*.exe
            dist/SHA256SUMS.txt
            packaging/winget/*.yaml
