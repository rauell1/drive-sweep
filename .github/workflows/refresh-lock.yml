name: Refresh dependency lock

# Weekly: move requirements-dev.lock to the newest allowed versions, run the full test suite and
# the vulnerability audit against them on Windows, and only then open a pull request.
# Pull requests opened with the workflow token do not start other workflows, which is why the
# tests run here first. Requires Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests".

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Regenerate lock with newest versions
        shell: pwsh
        run: python scripts/refresh_lock.py --upgrade

      - name: Check for changes
        id: diff
        shell: pwsh
        run: |
          git diff --quiet -- requirements-dev.lock
          if ($LASTEXITCODE -eq 0) { "changed=false" >> $env:GITHUB_OUTPUT } else { "changed=true" >> $env:GITHUB_OUTPUT }

      - name: Install and test the new versions
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\.venv\Scripts\python.exe scripts\collect_licenses.py

      - name: Audit the new versions for known vulnerabilities
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        run: pipx run pip-audit==2.10.1 --requirement requirements-dev.lock --require-hashes --disable-pip --progress-spinner off

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-lock
          delete-branch: true
          add-paths: |
            requirements-dev.lock
            THIRD_PARTY_NOTICES.txt
          commit-message: "build(deps): refresh requirements-dev.lock"
          title: "build(deps): refresh requirements-dev.lock"
          labels: dependencies
          body: |
            Weekly refresh of the hash locked build and test dependencies to their newest allowed versions.

            Before this pull request was opened, the workflow already:
            * installed the new lock with `--require-hashes` on Windows,
            * ran the full test suite against it,
            * ran `pip-audit` against it,
            * regenerated `THIRD_PARTY_NOTICES.txt`.

            Review the version changes in the diff, then merge.
