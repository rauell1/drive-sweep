ShortDescription: Safe Windows disk cleaner, fast NTFS drive analyzer, duplicate finder, and visual space treemap.
Description: >-
  DriveSweep helps Windows users reclaim disk space safely by cleaning temporary app caches,
  browser caches, and old Download installers while protecting personal folders and OS files.
  Includes an interactive zoomable disk treemap, duplicate file finder, Recycle Bin and WinSxS tools,
  optional low-disk scheduled alerts, and 100% offline local storage.
