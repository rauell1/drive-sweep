ShortDescription: Windows disk cleaner, fast NTFS drive analyzer, duplicate finder, and visual space treemap.
Description: >-
  DriveSweep helps Windows users reclaim disk space by cleaning temporary app caches,
  browser caches, and old Download installers, with guards for personal folders and OS files.
  Includes an interactive disk breakdown, duplicate file finder, Recycle Bin and WinSxS tools,
  optional low-disk scheduled alerts, and local-only data storage (update checks are optional and off by default).
